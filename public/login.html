<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ReScheduled</title>
    <link rel="stylesheet" href="./css/style.css">
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');const s=localStorage.getItem('fontSize');if(s)document.documentElement.setAttribute('data-size',s);</script>
    <style>
        .login-wrap {
            max-width: 400px;
            margin: 60px auto;
            padding: 32px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            box-sizing: border-box;
        }

        .demo-bar {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px dashed var(--border);
            display: flex;
            gap: 10px;
        }
    </style>
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header class="navbar" role="banner">
        <div class="nav-container">
            <a href="/" class="logo">
                <span class="brand-name">ReScheduled</span>
            </a>
            <nav class="nav-links" aria-label="Main navigation">
                <a href="/dashboard.html">Dashboard</a>
                <a href="/timetable.html">Timetable</a>
                <a href="/notices.html">Notices</a>
                <a href="/view-tasks.html">Tasks</a>
            </nav>
            <div class="header-controls">
                <div class="size-controls" role="group" aria-label="Text size adjustment">
                    <button type="button" data-size="-1" aria-label="Decrease text size" title="Decrease text size">A−</button>
                    <button type="button" data-size="0" aria-label="Reset text size" aria-pressed="true" title="Reset text size">A</button>
                    <button type="button" data-size="1" aria-label="Increase text size" title="Increase text size">A+</button>
                </div>
                <button type="button" id="themeToggle" class="theme-toggle-btn" aria-label="Toggle dark theme" title="Toggle theme">☾</button>
            </div>
        </div>
    </header>

    <main class="main-container" id="main-content">
        <div class="login-wrap">
            <h1 style="margin: 0 0 6px 0; font-size: 24px;">Sign In</h1>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">Class Representative / Admin Portal</p>

            <div id="login-alert" role="alert" aria-live="assertive" style="display: none; padding: 10px 14px; background: #fee2e2; color: #991b1b; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px;"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email <span aria-hidden="true">*</span></label>
                    <input type="email" id="email" required aria-required="true" autocomplete="username" placeholder="cr@rescheduled.edu">
                </div>
                <div class="form-group">
                    <label for="password">Password <span aria-hidden="true">*</span></label>
                    <input type="password" id="password" required aria-required="true" autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" id="submit-btn" class="btn-primary" style="width: 100%; padding: 12px; cursor: pointer;">Sign In</button>
            </form>
        </div>
    </main>

    <footer role="contentinfo">
        <hr>
        <div class="footer-container">
            <div class="footer-content">
                <div class="footer-logo">
                    <span class="brand-name">ReScheduled</span>
                </div>
                <nav class="footer-links" aria-label="Footer quick links">
                    <a href="/admin-add-notice.html">+ Post Notice</a>
                    <a href="/notices.html">View Notices</a>
                    <a href="/timetable.html">View Timetable</a>
                    <a href="/view-tasks.html">View Tasks</a>
                </nav>
            </div>
            <p>&copy; Copyrights reserved 2026 | ReScheduled</p>
        </div>
    </footer>

    <script src="./scripts/a11y.js"></script>
    <script>
        async function verifySession() {
            try {
                const res = await fetch('/api/auth/me');
                if (res.ok) {
                    const data = await res.json();
                    if (data.user?.role === 'CR') {
                        window.location.href = '/admin-dashboard.html';
                    }
                }
            } catch (err) {
            }
        }
        verifySession();

        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('login-alert');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submit-btn');

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (data.success) {
                    window.showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/admin-dashboard.html';
                    }, 500);
                } else {
                    const msg = data.message || 'Login failed. Please check your credentials.';
                    alertBox.textContent = msg;
                    alertBox.style.display = 'block';
                    window.showToast(msg, 'error');
                }
            } catch (err) {
                const errMsg = 'Server error connecting to login. Please try again later.';
                alertBox.textContent = errMsg;
                alertBox.style.display = 'block';
                window.showToast(errMsg, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
