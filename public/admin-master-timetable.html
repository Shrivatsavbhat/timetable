<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Timetable - ReScheduled</title>
    <link rel="stylesheet" href="./css/admin-master.css">
</head>

<body>

    <div class="page">
        <header class="top">
            <div>
                <h1 class="title">Master Timetable</h1>
                <p class="subtitle">Constant weekly schedule blueprint (Monday - Saturday).</p>
            </div>
            <div>
                <a href="/" style="color: var(--primary); text-decoration: none; font-weight: 600; font-size: 14px;">←
                    Back to Home</a>
            </div>
        </header>

        <!-- Slot Configuration Form -->
        <section class="card">
            <h2>Add Timetable Slot</h2>
            <form id="slot-form">
                <div class="form-grid">
                    <div>
                        <label for="semester">Semester</label>
                        <select id="semester" required>
                            <option value="MCA Sem 1" selected>MCA Sem 1</option>
                            <option value="MCA Sem 2">MCA Sem 2</option>
                            <option value="MCA Sem 3">MCA Sem 3</option>
                            <option value="MCA Sem 4">MCA Sem 4</option>
                        </select>
                    </div>

                    <div>
                        <label for="day">Day</label>
                        <select id="day" required>
                            <option value="Monday">Monday</option>
                            <option value="Tuesday">Tuesday</option>
                            <option value="Wednesday">Wednesday</option>
                            <option value="Thursday">Thursday</option>
                            <option value="Friday">Friday</option>
                            <option value="Saturday">Saturday</option>
                        </select>
                    </div>

                    <div>
                        <label for="slot">Slot</label>
                        <input type="text" id="slot" placeholder="e.g. Slot 1" required>
                    </div>

                    <div>
                        <label for="time">Time</label>
                        <input type="text" id="time" placeholder="e.g. 09:00 AM - 10:00 AM" required>
                    </div>

                    <div>
                        <label for="code">Course Code</label>
                        <input type="text" id="code" placeholder="e.g. MCA201" required>
                    </div>

                    <div>
                        <label for="subject">Subject Title</label>
                        <input type="text" id="subject" placeholder="e.g. Database Systems" required>
                    </div>

                    <div>
                        <label for="faculty">Faculty</label>
                        <input type="text" id="faculty" placeholder="e.g. Dr. Sharma" required>
                    </div>

                    <div>
                        <label for="room">Room / Lab</label>
                        <input type="text" id="room" placeholder="e.g. Lab 2" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Save Slot</button>
            </form>
        </section>

        <!-- Master Timetable Grid / List -->
        <section class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h2>Master Schedule</h2>
                <select id="filter-day" style="width: auto; padding: 6px 10px;">
                    <option value="">All Days</option>
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                    <option value="Saturday">Saturday</option>
                </select>
            </div>

            <div id="slots-list" class="slots">
                <div class="empty">Loading timetable slots...</div>
            </div>
        </section>
    </div>

    <div id="edit-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="edit-title">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="edit-title">Edit Timetable Slot</h2>
                <button type="button" class="close-btn" onclick="closeEditModal()" aria-label="Close">✕</button>
            </div>
            <form id="edit-form">
                <div class="form-grid">
                    <div>
                        <label for="edit-day">Day</label>
                        <select id="edit-day" required>
                            <option>Monday</option>
                            <option>Tuesday</option>
                            <option>Wednesday</option>
                            <option>Thursday</option>
                            <option>Friday</option>
                            <option>Saturday</option>
                        </select>
                    </div>
                    <div><label for="edit-slot">Slot</label><input id="edit-slot" required></div>
                    <div><label for="edit-time">Time</label><input id="edit-time" required></div>
                    <div><label for="edit-code">Course Code</label><input id="edit-code" required></div>
                    <div><label for="edit-subject">Subject Title</label><input id="edit-subject" required></div>
                    <div><label for="edit-faculty">Faculty</label><input id="edit-faculty" required></div>
                    <div><label for="edit-room">Room / Lab</label><input id="edit-room" required></div>
                </div>
                <div class="swap-row">
                    <label for="swap-target">Swap this lecture's day/time with</label>
                    <select id="swap-target">
                        <option value="">No swap — save the edits above</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="submit-btn">Save Permanent Changes</button>
                    <button type="button" class="swap-btn" onclick="swapSelectedSlot()">Swap Schedule Positions</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('slot-form');
        const slotsList = document.getElementById('slots-list');
        const filterDay = document.getElementById('filter-day');
        const editModal = document.getElementById('edit-modal');
        const editForm = document.getElementById('edit-form');
        const swapTarget = document.getElementById('swap-target');
        let loadedSlots = [];
        let editingSlotId = null;
        const dayOrder = {
            Monday: 1,
            Tuesday: 2,
            Wednesday: 3,
            Thursday: 4,
            Friday: 5,
            Saturday: 6
        };

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (character) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[character]));
        }

        function getStartTimeMinutes(time) {
            const match = String(time || '').match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
            if (!match) return Number.MAX_SAFE_INTEGER;

            let hours = Number(match[1]);
            const minutes = Number(match[2]);
            const meridiem = match[3]?.toUpperCase();
            if (meridiem === 'AM' && hours === 12) hours = 0;
            if (meridiem === 'PM' && hours !== 12) hours += 12;
            return hours * 60 + minutes;
        }

        function sortSlots(slots) {
            return [...slots].sort((first, second) =>
                (dayOrder[first.day] || Number.MAX_SAFE_INTEGER) - (dayOrder[second.day] || Number.MAX_SAFE_INTEGER) ||
                getStartTimeMinutes(first.time) - getStartTimeMinutes(second.time) ||
                String(first.slot).localeCompare(String(second.slot), undefined, { numeric: true })
            );
        }

        // Fetch and render master timetable slots
        async function loadSlots() {
            try {
                const res = await fetch('/api/master');
                const slots = sortSlots(await res.json());
                loadedSlots = slots;
                const visibleSlots = filterDay.value
                    ? slots.filter((slot) => slot.day === filterDay.value)
                    : slots;

                if (!visibleSlots || !visibleSlots.length) {
                    slotsList.innerHTML = '<div class="empty">No timetable slots found.</div>';
                    return;
                }

                slotsList.innerHTML = visibleSlots.map(s => `
            <div class="slot">
                <strong>${escapeHtml(s.subject)} (${escapeHtml(s.code)})</strong>
                <span>${escapeHtml(s.day)} • ${escapeHtml(s.slot)} (${escapeHtml(s.time)})</span>
                <small>📍 ${escapeHtml(s.room)} | 👨‍🏫 ${escapeHtml(s.faculty)}</small>
                <div class="slot-actions">
                    <button class="edit-btn" onclick="openEditModal('${s._id}')">Edit</button>
                    <button class="del-btn" onclick="deleteSlot('${s._id}')">Delete ✕</button>
                </div>
            </div>
        `).join('');
            } catch {
                slotsList.innerHTML = '<div class="empty">Unable to load timetable slots.</div>';
            }
        }

        function openEditModal(id) {
            const slot = loadedSlots.find((item) => item._id === id);
            if (!slot) return;

            editingSlotId = id;
            ['day', 'slot', 'time', 'code', 'subject', 'faculty', 'room'].forEach((field) => {
                document.getElementById(`edit-${field}`).value = slot[field] || '';
            });
            swapTarget.innerHTML = '<option value="">Select another lecture to swap with...</option>' +
                sortSlots(loadedSlots)
                    .filter((item) => item._id !== id &&
                        (!slot.semester || !item.semester || item.semester === slot.semester))
                    .map((item) => `<option value="${item._id}">${escapeHtml(item.subject)} — ${escapeHtml(item.day)} ${escapeHtml(item.time)}${item.semester ? ` (${escapeHtml(item.semester)})` : ''}</option>`)
                    .join('');
            if (swapTarget.options.length === 1) {
                swapTarget.options[0].textContent = 'No other lectures available to swap';
            }
            editModal.classList.remove('hidden');
        }

        function closeEditModal() {
            editModal.classList.add('hidden');
            editingSlotId = null;
        }

        editForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!editingSlotId) return;

            const data = Object.fromEntries(
                ['day', 'slot', 'time', 'code', 'subject', 'faculty', 'room']
                    .map((field) => [field, document.getElementById(`edit-${field}`).value.trim()])
            );
            const res = await fetch(`/api/master/${editingSlotId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (!res.ok) {
                const result = await res.json().catch(() => ({}));
                alert(result.error || 'Failed to update slot.');
                return;
            }

            alert('Slot updated permanently.');
            closeEditModal();
            loadSlots();
        });

        async function swapSelectedSlot() {
            const secondId = swapTarget.value;
            if (!editingSlotId || !secondId) {
                alert('Select another lecture to swap with.');
                return;
            }
            if (!confirm('Swap the day, slot, and time of these two lectures permanently?')) return;

            const res = await fetch('/api/master/swap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ firstId: editingSlotId, secondId })
            });
            if (!res.ok) {
                const result = await res.json().catch(() => ({}));
                alert(result.error || 'Failed to swap lectures.');
                return;
            }

            alert('Lecture schedule positions swapped permanently.');
            closeEditModal();
            loadSlots();
        }

        // Add slot
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                semester: document.getElementById('semester').value,
                day: document.getElementById('day').value,
                slot: document.getElementById('slot').value,
                time: document.getElementById('time').value,
                code: document.getElementById('code').value,
                subject: document.getElementById('subject').value,
                faculty: document.getElementById('faculty').value,
                room: document.getElementById('room').value
            };

            const res = await fetch('/api/master', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert('Slot saved successfully!');
                form.reset();
                loadSlots();
            } else {
                alert('Failed to save slot.');
            }
        });

        // Delete slot
        async function deleteSlot(id) {
            if (!confirm('Delete this slot?')) return;
            await fetch(`/api/master/${id}`, { method: 'DELETE' });
            loadSlots();
        }

        filterDay.addEventListener('change', loadSlots);
        loadSlots();

        // Check with server session if user is authorized CR
        async function verifySession() {
            try {
                const res = await fetch('/api/auth/me');
                if (!res.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                const data = await res.json();
                if (data.user.role !== 'CR') {
                    alert('Access restricted to Class Representatives.');
                    window.location.href = '/dashboard.html';
                }
            } catch (err) {
                window.location.href = '/login.html';
            }
        }
        verifySession();
    </script>

</body>

</html>
