<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReScheduled - Notification Center</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/notify.css">
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');</script>
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Shared Navbar -->
    <header class="navbar" role="banner">
        <div class="nav-container">
            <a href="/" class="logo">
                <span class="logo-box" aria-hidden="true">R</span>
                <span class="brand-name">ReScheduled</span>
            </a>
            <nav class="nav-links" aria-label="Main navigation">
                <a href="/dashboard.html">Dashboard</a>
                <a href="/timetable.html">Timetable</a>
                <a href="/notices.html">Notices</a>
                <a href="/notifications.html" class="active" aria-current="page">Alerts</a>
            </nav>
        </div>
    </header>

<main class="page" id="main-content">

    <div class="top">
        <div>
            <h1 class="title">Notification Center</h1>
            <p class="subtitle">
                Live log of timetable adjustments, room changes and notices.
            </p>
        </div>
    </div>

    <div class="toolbar">

        <div class="filters" role="group" aria-label="Filter notifications by type">

            <button class="filter-btn active" data-filter="all" aria-pressed="true">
                All <span class="filter-count" id="all-count">0</span>
            </button>

            <button class="filter-btn" data-filter="cancellations" aria-pressed="false">
                Cancellations
                <span class="filter-count" id="cancel-count">0</span>
            </button>

            <button class="filter-btn" data-filter="room-swaps" aria-pressed="false">
                Room Swaps
                <span class="filter-count" id="room-count">0</span>
            </button>

            <button class="filter-btn" data-filter="notices" aria-pressed="false">
                General Notices
                <span class="filter-count" id="notice-count">0</span>
            </button>

        </div>

    </div>

    <section class="feed" id="notification-list" role="feed" aria-label="Notification feed" aria-live="polite">
        <div class="empty">Loading notifications...</div>
    </section>

    <div class="archive" role="note">
        Historical records beyond 7 days archived
    </div>

</main>

<script>

let notifications = [];
let currentFilter = "all";


/* =========================
   FETCH NOTIFICATIONS
========================= */

async function getNotifications() {

    try {

        const response = await fetch("/api/notices");

        if (!response.ok) {
            throw new Error("Failed to fetch notifications");
        }

        const data = await response.json();

        console.log("API response:", data);

        if (!data.success) {
            throw new Error(data.message || "Failed to load notices");
        }

        notifications = data.notices || [];

        updateCounts();
        displayNotifications();

    } catch (error) {

        console.error("Notification Error:", error);

        document.getElementById("notification-list").innerHTML =
            `<div class="empty">Unable to load notifications.</div>`;
    }
}


/* =========================
   FORMAT TIME
========================= */

function formatTime(date) {

    const d = new Date(date);

    if (isNaN(d.getTime())) {
        return "";
    }

    const diff = Math.floor((new Date() - d) / 1000);

    if (diff < 60) {
        return "Just now";
    }

    if (diff < 3600) {
        return Math.floor(diff / 60) + " mins ago";
    }

    if (diff < 86400) {
        return Math.floor(diff / 3600) + " hours ago";
    }

    return d.toLocaleDateString([], {
        day: "2-digit",
        month: "short",
        year: "numeric"
    });
}


/* =========================
   BADGE
========================= */

function getBadge(priority) {

    const badges = {

        Urgent: [
            "Urgent",
            "cancelled"
        ],

        High: [
            "High",
            "room"
        ],

        "Schedule Shift": [
            "Schedule Shift",
            "room"
        ],

        General: [
            "Notice",
            "general"
        ]

    };

    return badges[priority] || badges.General;
}


/* =========================
   DISPLAY NOTIFICATIONS
========================= */

function displayNotifications() {

    const list = document.getElementById("notification-list");

    let filtered = notifications;


    /* FILTER */

    if (currentFilter === "cancellations") {

        filtered = notifications.filter(
            n => n.priority === "Urgent"
        );

    }

    else if (currentFilter === "room-swaps") {

        filtered = notifications.filter(
            n =>
                n.priority === "High" ||
                n.priority === "Schedule Shift"
        );

    }

    else if (currentFilter === "notices") {

        filtered = notifications.filter(
            n => n.priority === "General"
        );

    }


    /* EMPTY */

    if (!filtered.length) {

        list.innerHTML =
            `<div class="empty">No notifications found.</div>`;

        return;
    }


    // to display

    list.innerHTML = filtered.map(n => {

        const [text, className] =
            getBadge(n.priority);

        const timeStr = formatTime(n.createdAt);
        const ariaLabel = `${text} priority alert: ${n.title}, posted ${timeStr}. ${n.content}`;

        return `

            <article class="notification" tabindex="0" role="article" aria-label="${ariaLabel}">

                <div class="dot" aria-hidden="true"></div>

                <div class="notification-content">

                    <div class="notification-top">

                        <span class="badge ${className}">
                            ${text}
                        </span>

                        <span class="time">
                            ${timeStr}
                        </span>

                    </div>

                    <h2 class="notification-title">
                        ${n.title}
                    </h2>

                    <p class="notification-text">
                        ${n.content}
                    </p>

                </div>

            </article>

        `;

    }).join("");
}


function updateCounts() { //updating the count

    document.getElementById("all-count").textContent =
        notifications.length;


    document.getElementById("cancel-count").textContent =
        notifications.filter(
            n => n.priority === "Urgent"
        ).length;


    document.getElementById("room-count").textContent =
        notifications.filter(
            n =>
                n.priority === "High" ||
                n.priority === "Schedule Shift"
        ).length;


    document.getElementById("notice-count").textContent =
        notifications.filter(
            n => n.priority === "General"
        ).length;
}


/* =========================
   FILTER BUTTONS
========================= */

document.querySelectorAll(".filter-btn").forEach(btn => {

    btn.addEventListener("click", () => {

        document.querySelectorAll(".filter-btn").forEach(b => {
            b.classList.remove("active");
            b.setAttribute("aria-pressed", "false");
        });

        btn.classList.add("active");
        btn.setAttribute("aria-pressed", "true");

        currentFilter =
            btn.dataset.filter;

        displayNotifications();

    });

});

getNotifications();

setInterval(getNotifications, 30000);

</script>
<script src="./scripts/a11y.js"></script>

</body>
</html>
