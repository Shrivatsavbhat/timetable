<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Notices — ReScheduled</title>

  <!-- Google Fonts: Poppins (matches team typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Shared Global Stylesheet -->
  <link rel="stylesheet" href="./css/style.css">

  <!-- Notices Stylesheet -->
  <link rel="stylesheet" href="./css/notices.css">
</head>
<body>

  <!-- Shared Navigation Bar (Matches Dashboard & Timetable) -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">
        <span class="logo-box">R</span>
        <span class="brand-name">ReScheduled</span>
      </a>
      <div class="nav-links">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/timetable.html">Timetable</a>
        <a href="/notices.html" class="active">Notices</a>
        <a href="/notifications.html">Alerts</a>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="page-wrap">
    <div class="card-wrap">

      <!-- Top Header & Actions -->
      <div class="top-bar">
        <div class="title-group">
          <h1>📢 Campus Notices Feed</h1>
          <p>Official announcements, schedule changes, and departmental memos</p>
        </div>
        <div class="top-actions">
          <a href="/timetable.html" class="btn-pill">&larr; Timetable</a>
        </div>
      </div>

      <!-- Filters & Search (Pure Flexbox, Same as Timetable) -->
      <div class="filter-row">
        <div class="filter-item">
          <label>Academic Term</label>
          <select id="semSelect" onchange="fetchNotices()">
            <option value="1" selected>1st Sem — I MCA (Sec A)</option>
            <option value="3">3rd Sem — I MCA (Sec A)</option>
            <option value="5">5th Sem — I MCA (Sec A)</option>
          </select>
        </div>
        <div class="filter-item">
          <label>Search Notices by Title, Content, or Keyword</label>
          <input
            type="search"
            id="searchInput"
            placeholder="🔍 Search e.g. Machine Learning, Room 301, Lab 3"
            oninput="handleSearch(this.value)"
          />
        </div>
      </div>

      <!-- Category Filter Buttons (Matches timetable.html day buttons) -->
      <div class="category-row" id="catButtons">
        <button class="category-btn active" data-cat="all" onclick="selectCategory('all', this)">All Notices</button>
        <button class="category-btn" data-cat="urgent" onclick="selectCategory('urgent', this)">🚨 Urgent</button>
        <button class="category-btn" data-cat="shift" onclick="selectCategory('shift', this)">🔄 Schedule Shift</button>
        <button class="category-btn" data-cat="general" onclick="selectCategory('general', this)">📌 General</button>
      </div>

      <!-- Legend & Status Row (Matches timetable.html) -->
      <div class="legend-row">
        <div id="statusLabel" style="font-weight: 600;">All Campus Notices</div>
        <div style="display: flex; gap: 14px; align-items: center;">
          <span><span class="legend-dot" style="background: #dc2626;"></span>Urgent</span>
          <span><span class="legend-dot" style="background: var(--primary);"></span>Schedule Shift</span>
          <span><span class="legend-dot" style="background: #64748b;"></span>General</span>
        </div>
      </div>

      <!-- Notice Cards Feed (Pure Flexbox) -->
      <div class="notice-list" id="noticeContainer">
        <p style="text-align: center; color: var(--text-muted); padding: 30px;">Loading notices...</p>
      </div>

      <!-- Footer Info -->
      <div class="card-footer">
        <span>🟢 Live sync active with Department Notice Board</span>
        <span>Class: <strong>I MCA Section A</strong></span>
      </div>

    </div>
  </main>

  <!-- Modal Dialog for Full Memo Review -->
  <div class="modal-backdrop" id="noticeModal" role="dialog" aria-modal="true" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()" aria-label="Close modal">&times;</button>
      <div id="modalCategory" style="margin-bottom: 8px;"></div>
      <h2 id="modalTitle" style="font-size: 18px; font-weight: 700; color: var(--text-main); margin: 0 0 8px 0;"></h2>
      <p id="modalDate" style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;"></p>
      <hr style="border: none; border-top: 1px solid var(--border); margin-bottom: 14px;" />
      <p id="modalContent" style="font-size: 14px; color: var(--text-main); line-height: 1.6;"></p>
    </div>
  </div>

  <!-- Client-Side Logic (Simple, Clean, Easy to Explain in Viva) -->
  <script>
    let allNotices = [];
    let activeCategory = 'all';
    let searchQuery = '';

    // 1. Fetch notices from server
    async function fetchNotices() {
      try {
        const res = await fetch('/api/notices');
        const data = await res.json();
        allNotices = data.notices || (Array.isArray(data) ? data : []);
        renderNotices();
      } catch (err) {
        document.getElementById('noticeContainer').innerHTML =
          '<p style="text-align: center; color: #dc2626; padding: 20px;">Unable to load notices from server.</p>';
      }
    }

    // 2. Render notice cards
    function renderNotices() {
      const container = document.getElementById('noticeContainer');
      const q = searchQuery.toLowerCase();

      const filtered = allNotices.filter(item => {
        const p = (item.priority || item.category || 'general').toLowerCase();

        let matchesCategory = (activeCategory === 'all');
        if (activeCategory === 'urgent') matchesCategory = (p === 'urgent' || p === 'high');
        else if (activeCategory === 'shift') matchesCategory = (p.includes('shift'));
        else if (activeCategory === 'general') matchesCategory = (p === 'general');

        const titleMatch = (item.title || '').toLowerCase().includes(q);
        const textMatch = (item.content || item.description || '').toLowerCase().includes(q);
        return matchesCategory && (titleMatch || textMatch);
      });

      if (!filtered.length) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px; border: 1px dashed var(--border); border-radius: 8px;">No matching notices found.</p>';
        return;
      }

      container.innerHTML = filtered.map(item => {
        const p = (item.priority || item.category || 'general').toLowerCase();
        let badgeClass = 'status-general';
        let cardBorderClass = 'is-general';
        let badgeLabel = 'General';

        if (p === 'urgent' || p === 'high') {
          badgeClass = 'status-urgent';
          cardBorderClass = 'is-urgent';
          badgeLabel = 'Urgent';
        } else if (p.includes('shift')) {
          badgeClass = 'status-shift';
          cardBorderClass = 'is-shift';
          badgeLabel = 'Schedule Shift';
        }

        // Date breakdown for the left box
        const rawDate = item.date || item.createdAt;
        const dObj = rawDate ? new Date(rawDate) : new Date();
        const dayNum = dObj.getDate();
        const monthShort = dObj.toLocaleString('en-US', { month: 'short' });
        const yearNum = dObj.getFullYear();

        return `
          <div class="notice-card ${cardBorderClass}" onclick="openModal('${item._id}')">
            <div class="notice-date-box">
              <span class="notice-date-day">${dayNum}</span>
              <span class="notice-date-month">${monthShort}</span>
              <span class="notice-date-year">${yearNum}</span>
            </div>
            <div class="notice-body">
              <div class="notice-top">
                <span class="notice-title">${item.title || 'Untitled Notice'}</span>
                <span class="status-pill ${badgeClass}">${badgeLabel}</span>
              </div>
              <p class="notice-snippet">${(item.content || item.description || '').slice(0, 140)}...</p>
              <div class="notice-meta">
                <span>🏛️ Department Memo</span>
                <span style="color: var(--primary); font-weight: 600;">Read Full Notice &rarr;</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 3. Category Selector Handler (Matches Day Selection in Timetable)
    function selectCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const labels = {
        all: 'All Campus Notices',
        urgent: '🚨 Urgent & High Priority Notices',
        shift: '🔄 Schedule Shift Notices',
        general: '📌 General Department Notices'
      };
      document.getElementById('statusLabel').textContent = labels[cat] || 'Campus Notices';
      renderNotices();
    }

    // 4. Instant Search Handler
    function handleSearch(val) {
      searchQuery = val.trim();
      renderNotices();
    }

    // 5. Modal Dialog Handlers
    function openModal(id) {
      const item = allNotices.find(n => n._id === id);
      if (!item) return;

      const p = (item.priority || item.category || 'general').toLowerCase();
      let badgeClass = 'status-general';
      let badgeLabel = 'General';
      if (p === 'urgent' || p === 'high') { badgeClass = 'status-urgent'; badgeLabel = 'Urgent'; }
      else if (p.includes('shift')) { badgeClass = 'status-shift'; badgeLabel = 'Schedule Shift'; }

      document.getElementById('modalCategory').innerHTML = `<span class="status-pill ${badgeClass}">${badgeLabel}</span>`;
      document.getElementById('modalTitle').textContent = item.title || 'Announcement';
      document.getElementById('modalDate').textContent = '📅 Published: ' + (item.date || (item.createdAt ? new Date(item.createdAt).toLocaleDateString() : 'Recent'));
      document.getElementById('modalContent').textContent = item.content || item.description || '';
      document.getElementById('noticeModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('noticeModal').classList.remove('show');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    window.onload = fetchNotices;
  </script>
</body>
</html>
