<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Notices — ReScheduled</title>


  <link rel="stylesheet" href="./css/style.css">


  <link rel="stylesheet" href="./css/notices.css?v=2">
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');const s=localStorage.getItem('fontSize');if(s)document.documentElement.setAttribute('data-size',s);</script>
</head>
<body>


  <header class="navbar" role="banner">
    <div class="nav-container">
      <a href="/" class="logo">
        <span class="brand-name">ReScheduled</span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/timetable.html">Timetable</a>
        <a href="/notices.html" class="active" aria-current="page">Notices</a>
        <a href="/view-tasks.html">Tasks</a>
      </nav>
      <div class="header-controls">
        <div class="size-controls" role="group" aria-label="Text size adjustment">
          <button type="button" data-size="-1" aria-label="Decrease text size" title="Decrease text size">A−</button>
          <button type="button" data-size="0" aria-label="Reset text size" aria-pressed="true" title="Reset text size">A</button>
          <button type="button" data-size="1" aria-label="Increase text size" title="Increase text size">A+</button>
        </div>
        <button type="button" id="themeToggle" class="theme-toggle-btn" aria-label="Toggle dark theme" title="Toggle theme">☾</button>
        <a href="/login.html" class="cr-login-btn">CR Login</a>
      </div>
    </div>
  </header>


  <div class="page">


    <header class="top">
      <div>
        <h1 class="title">Campus Notices</h1>
        <p class="subtitle">Live log of timetable adjustments, room changes and official notices.</p>
      </div>
    </header>


    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter notices by category">
        <button class="filter-btn active" data-cat="all" onclick="setCategory('all', this)">
          All <span class="filter-count" id="count-all">0</span>
        </button>
        <button class="filter-btn" data-cat="urgent" onclick="setCategory('urgent', this)">
          Urgent <span class="filter-count" id="count-urgent">0</span>
        </button>
        <button class="filter-btn" data-cat="shift" onclick="setCategory('shift', this)">
          Schedule Shift <span class="filter-count" id="count-shift">0</span>
        </button>
        <button class="filter-btn" data-cat="general" onclick="setCategory('general', this)">
          General Notices <span class="filter-count" id="count-general">0</span>
        </button>
      </div>

      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="Search notices..."
        oninput="handleSearch(this.value)"
        aria-label="Search notices"
      />
    </div>


    <section class="feed" id="noticeContainer">
      <div class="empty">Loading campus notices...</div>
    </section>

  </div>


  <div class="modal-backdrop" id="noticeModal" role="dialog" aria-modal="true" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()" aria-label="Close modal">&times;</button>
      <div id="modalCategory" style="margin-bottom: 8px;"></div>
      <h2 id="modalTitle" style="font-size: 18px; font-weight: 700; color: var(--text-main); margin: 0 0 8px 0;"></h2>
      <p id="modalDate" style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;"></p>
      <hr style="border: none; border-top: 1px solid var(--border); margin-bottom: 14px;" />
      <p id="modalContent" style="font-size: 14px; color: var(--text-main); line-height: 1.6;"></p>
    </div>
  </div>


  <script>
    let allNotices = [];
    let activeCategory = 'all';
    let searchQuery = '';
    async function fetchNotices() {
      try {
        const res = await fetch('/api/notices');
        const data = await res.json();
        allNotices = data.notices || (Array.isArray(data) ? data : []);
        updateCounts();
        renderNotices();
      } catch (err) {
        document.getElementById('noticeContainer').innerHTML =
          '<div class="empty" style="color: #be123c;">Unable to load notices from server.</div>';
      }
    }
    function updateCounts() {
      const all = allNotices.length;
      const urgent = allNotices.filter(n => {
        const p = (n.priority || n.category || '').toLowerCase();
        return p === 'urgent' || p === 'high';
      }).length;
      const shift = allNotices.filter(n => {
        const p = (n.priority || n.category || '').toLowerCase();
        return p.includes('shift');
      }).length;
      const general = allNotices.filter(n => {
        const p = (n.priority || n.category || '').toLowerCase();
        return p === 'general' || (!p.includes('shift') && p !== 'urgent' && p !== 'high');
      }).length;

      document.getElementById('count-all').textContent = all;
      document.getElementById('count-urgent').textContent = urgent;
      document.getElementById('count-shift').textContent = shift;
      document.getElementById('count-general').textContent = general;
    }
    function formatTime(dateVal) {
      if (!dateVal) return "Recent";
      const d = new Date(dateVal);
      if (isNaN(d.getTime())) return "Recent";

      const diffSecs = Math.floor((new Date() - d) / 1000);
      if (diffSecs < 60) return "Just now";
      if (diffSecs < 3600) return Math.floor(diffSecs / 60) + " mins ago";
      if (diffSecs < 86400) return Math.floor(diffSecs / 3600) + " hours ago";

      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
    function renderNotices() {
      const container = document.getElementById('noticeContainer');
      const q = searchQuery.toLowerCase();

      const filtered = allNotices.filter(item => {
        const p = (item.priority || item.category || 'general').toLowerCase();

        let matchesCategory = (activeCategory === 'all');
        if (activeCategory === 'urgent') matchesCategory = (p === 'urgent' || p === 'high');
        else if (activeCategory === 'shift') matchesCategory = (p.includes('shift'));
        else if (activeCategory === 'general') matchesCategory = (p === 'general' || (!p.includes('shift') && p !== 'urgent' && p !== 'high'));

        const titleMatch = (item.title || '').toLowerCase().includes(q);
        const textMatch = (item.content || item.description || '').toLowerCase().includes(q);
        return matchesCategory && (titleMatch || textMatch);
      });

      if (!filtered.length) {
        container.innerHTML = '<div class="empty">No matching notices found.</div>';
        return;
      }

      container.innerHTML = filtered.map(item => {
        const p = (item.priority || item.category || 'general').toLowerCase();
        let badgeClass = 'general';
        let badgeLabel = 'Notice';

        if (p === 'urgent') {
          badgeClass = 'urgent';
          badgeLabel = 'Urgent';
        } else if (p === 'high') {
          badgeClass = 'high';
          badgeLabel = 'High';
        } else if (p.includes('shift')) {
          badgeClass = 'shift';
          badgeLabel = 'Schedule Shift';
        }

        const timeStr = formatTime(item.createdAt || item.date);

        return `
          <article class="notification" onclick="openModal('${item._id}')">
            <div class="dot"></div>
            <div class="notification-content">
              <div class="notification-top">
                <span class="badge ${badgeClass}">${badgeLabel}</span>
                <span class="time">${timeStr}</span>
              </div>
              <h3 class="notification-title">${item.title || 'Untitled Notice'}</h3>
              <p class="notification-desc">${item.content || item.description || ''}</p>
            </div>
          </article>
        `;
      }).join('');
    }
    function setCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderNotices();
    }
    function handleSearch(val) {
      searchQuery = val.trim();
      renderNotices();
    }
    function openModal(id) {
      const item = allNotices.find(n => n._id === id);
      if (!item) return;

      const p = (item.priority || item.category || 'general').toLowerCase();
      let badgeClass = 'general';
      let badgeLabel = 'Notice';
      if (p === 'urgent') { badgeClass = 'urgent'; badgeLabel = 'Urgent'; }
      else if (p === 'high') { badgeClass = 'high'; badgeLabel = 'High'; }
      else if (p.includes('shift')) { badgeClass = 'shift'; badgeLabel = 'Schedule Shift'; }

      document.getElementById('modalCategory').innerHTML = `<span class="badge ${badgeClass}">${badgeLabel}</span>`;
      document.getElementById('modalTitle').textContent = item.title || 'Announcement';
      document.getElementById('modalDate').textContent = 'Posted: ' + formatTime(item.createdAt || item.date);
      document.getElementById('modalContent').textContent = item.content || item.description || '';
      document.getElementById('noticeModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('noticeModal').classList.remove('show');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    window.onload = fetchNotices;
  </script>
  <footer role="contentinfo">
    <hr>
    <div class="footer-container">
      <div class="footer-content">
        <div class="footer-logo">
          <span class="brand-name">ReScheduled</span>
        </div>
        <nav class="footer-links" aria-label="Footer quick links">
          <a href="/notices.html">View Notices</a>
          <a href="/timetable.html">View Timetable</a>
          <a href="/view-tasks.html">View Tasks</a>
        </nav>
      </div>
      <p>&copy; Copyrights reserved 2026 | ReScheduled</p>
    </div>
  </footer>
  <script src="./scripts/a11y.js"></script>
</body>
</html>
