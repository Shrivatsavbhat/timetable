<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Notices — ReScheduled</title>

  <!-- Google Fonts: Poppins (matches team typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Shared Global Stylesheet -->
  <link rel="stylesheet" href="./css/style.css">

  <!-- Notices Stylesheet -->
  <link rel="stylesheet" href="./css/notices.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Shared Navbar -->
  <header class="navbar" role="banner">
    <div class="nav-container">
      <a href="/" class="logo">
        <span class="logo-box" aria-hidden="true">R</span>
        <span class="brand-name">ReScheduled</span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/timetable.html">Timetable</a>
        <a href="/notices.html" class="active" aria-current="page">Notices</a>
        <a href="/notifications.html">Alerts</a>
      </nav>
    </div>
  </header>

  <!-- Main Simple Page Content (Matches Screenshot Layout) -->
  <main class="page" id="main-content">
    
    <!-- Top Header -->
    <div class="top">
      <div>
        <h1 class="title">Campus Notices</h1>
        <p class="subtitle">Live log of timetable adjustments, room changes and official notices.</p>
      </div>
      <div>
        <a href="/timetable.html" class="nav-btn">&larr; Timetable</a>
      </div>
    </div>

    <!-- Toolbar: Filter Pills + Search Input -->
    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter notices by category">
        <button class="filter-btn active" data-cat="all" onclick="setCategory('all', this)" aria-pressed="true">
          All <span class="filter-count" id="count-all">0</span>
        </button>
        <button class="filter-btn" data-cat="urgent" onclick="setCategory('urgent', this)" aria-pressed="false">
          Urgent <span class="filter-count" id="count-urgent">0</span>
        </button>
        <button class="filter-btn" data-cat="shift" onclick="setCategory('shift', this)" aria-pressed="false">
          Schedule Shift <span class="filter-count" id="count-shift">0</span>
        </button>
        <button class="filter-btn" data-cat="general" onclick="setCategory('general', this)" aria-pressed="false">
          General Notices <span class="filter-count" id="count-general">0</span>
        </button>
      </div>

      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="Search notices..."
        oninput="handleSearch(this.value)"
        aria-label="Search notices"
        autocomplete="off"
      />
    </div>

    <!-- Feed Container -->
    <section class="feed" id="noticeContainer" role="feed" aria-label="Campus notices feed" aria-live="polite">
      <div class="empty">Loading campus notices...</div>
    </section>

  </main>

  <!-- Pop-up Modal Dialog for Full Memo Review -->
  <div class="modal-backdrop" id="noticeModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()" aria-label="Close modal">&times;</button>
      <div id="modalCategory" style="margin-bottom: 8px;"></div>
      <h2 id="modalTitle" style="font-size: 18px; font-weight: 700; color: var(--text-main); margin: 0 0 8px 0;"></h2>
      <p id="modalDate" style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;"></p>
      <hr style="border: none; border-top: 1px solid var(--border); margin-bottom: 14px;" />
      <p id="modalContent" style="font-size: 14px; color: var(--text-main); line-height: 1.6;"></p>
    </div>
  </div>

  <!-- Client-Side Logic (Simple, Clean, Easy to Explain in Viva) -->
  <script src="./scripts/a11y.js"></script>
  <script>
    let allNotices = [];
    let activeCategory = 'all';
    let searchQuery = '';

    // 1. Fetch notices from API
    async function fetchNotices() {
      try {
        const res = await fetch('/api/notices');
        const data = await res.json();
        allNotices = data.notices || (Array.isArray(data) ? data : []);
        updateCounts();
        renderNotices();
      } catch (err) {
        document.getElementById('noticeContainer').innerHTML =
          '<div class="empty" style="color: #9f1239; font-weight: 600;">Unable to load notices from server.</div>';
      }
    }

    // 2. Update pill counts
    function updateCounts() {
      const all = allNotices.length;
      const urgent = allNotices.filter(n => {
        const p = (n.priority || n.category || '').toLowerCase();
        return p === 'urgent' || p === 'high';
      }).length;
      const shift = allNotices.filter(n => {
        const p = (n.priority || n.category || '').toLowerCase();
        return p.includes('shift');
      }).length;
      const general = allNotices.filter(n => {
        const p = (n.priority || n.category || '').toLowerCase();
        return p === 'general' || (!p.includes('shift') && p !== 'urgent' && p !== 'high');
      }).length;

      document.getElementById('count-all').textContent = all;
      document.getElementById('count-urgent').textContent = urgent;
      document.getElementById('count-shift').textContent = shift;
      document.getElementById('count-general').textContent = general;
    }

    // 3. Format timestamp like the screenshot ("8 hours ago", "Oct 16, 2026")
    function formatTime(dateVal) {
      if (!dateVal) return "Recent";
      const d = new Date(dateVal);
      if (isNaN(d.getTime())) return "Recent";

      const diffSecs = Math.floor((new Date() - d) / 1000);
      if (diffSecs < 60) return "Just now";
      if (diffSecs < 3600) return Math.floor(diffSecs / 60) + " mins ago";
      if (diffSecs < 86400) return Math.floor(diffSecs / 3600) + " hours ago";

      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // 4. Render feed cards (Matching the screenshot)
    function renderNotices() {
      const container = document.getElementById('noticeContainer');
      const q = searchQuery.toLowerCase();

      const filtered = allNotices.filter(item => {
        const p = (item.priority || item.category || 'general').toLowerCase();

        let matchesCategory = (activeCategory === 'all');
        if (activeCategory === 'urgent') matchesCategory = (p === 'urgent' || p === 'high');
        else if (activeCategory === 'shift') matchesCategory = (p.includes('shift'));
        else if (activeCategory === 'general') matchesCategory = (p === 'general' || (!p.includes('shift') && p !== 'urgent' && p !== 'high'));

        const titleMatch = (item.title || '').toLowerCase().includes(q);
        const textMatch = (item.content || item.description || '').toLowerCase().includes(q);
        return matchesCategory && (titleMatch || textMatch);
      });

      if (!filtered.length) {
        container.innerHTML = '<div class="empty">No matching notices found.</div>';
        return;
      }

      container.innerHTML = filtered.map(item => {
        const p = (item.priority || item.category || 'general').toLowerCase();
        let badgeClass = 'general';
        let badgeLabel = 'Notice';

        if (p === 'urgent') {
          badgeClass = 'urgent';
          badgeLabel = 'Urgent';
        } else if (p === 'high') {
          badgeClass = 'high';
          badgeLabel = 'High';
        } else if (p.includes('shift')) {
          badgeClass = 'shift';
          badgeLabel = 'Schedule Shift';
        }

        const timeStr = formatTime(item.createdAt || item.date);
        const ariaLabel = `${item.title || 'Notice'}, priority ${badgeLabel}, posted ${timeStr}. Press Enter or click to open full memo.`;

        return `
          <article class="notification" tabindex="0" role="button" aria-haspopup="dialog" aria-label="${ariaLabel}" onclick="openModal('${item._id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openModal('${item._id}');}">
            <div class="dot" aria-hidden="true"></div>
            <div class="notification-content">
              <div class="notification-top">
                <span class="badge ${badgeClass}">${badgeLabel}</span>
                <span class="time">${timeStr}</span>
              </div>
              <h3 class="notification-title">${item.title || 'Untitled Notice'}</h3>
              <p class="notification-desc">${item.content || item.description || ''}</p>
            </div>
          </article>
        `;
      }).join('');
    }

    // 5. Category Selection
    function setCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      renderNotices();
    }

    // 6. Search Filter
    function handleSearch(val) {
      searchQuery = val.trim();
      renderNotices();
    }

    // 7. Pop-up Modal Handlers
    let lastActiveNoticeTrigger = null;

    function openModal(id) {
      const item = allNotices.find(n => n._id === id);
      if (!item) return;

      lastActiveNoticeTrigger = document.activeElement;

      const p = (item.priority || item.category || 'general').toLowerCase();
      let badgeClass = 'general';
      let badgeLabel = 'Notice';
      if (p === 'urgent') { badgeClass = 'urgent'; badgeLabel = 'Urgent'; }
      else if (p === 'high') { badgeClass = 'high'; badgeLabel = 'High'; }
      else if (p.includes('shift')) { badgeClass = 'shift'; badgeLabel = 'Schedule Shift'; }

      document.getElementById('modalCategory').innerHTML = `<span class="badge ${badgeClass}">${badgeLabel}</span>`;
      document.getElementById('modalTitle').textContent = item.title || 'Announcement';
      document.getElementById('modalDate').textContent = 'Posted: ' + formatTime(item.createdAt || item.date);
      document.getElementById('modalContent').textContent = item.content || item.description || '';
      
      const modal = document.getElementById('noticeModal');
      modal.classList.add('show');
      const closeBtn = modal.querySelector('.modal-close');
      if (closeBtn) closeBtn.focus();
    }

    function closeModal() {
      const modal = document.getElementById('noticeModal');
      modal.classList.remove('show');
      if (lastActiveNoticeTrigger && typeof lastActiveNoticeTrigger.focus === 'function') {
        lastActiveNoticeTrigger.focus();
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    window.addEventListener('DOMContentLoaded', fetchNotices);
  </script>
</body>
</html>
