<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Notices — ReScheduled</title>

  <!-- Google Fonts: Poppins (matches team typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Shared Global Stylesheet -->
  <link rel="stylesheet" href="./css/style.css">

  <!-- Notices Stylesheet -->
  <link rel="stylesheet" href="./css/notices.css">
</head>
<body>

  <!-- Shared Navigation Bar (Matches Dashboard & Timetable) -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">
        <span class="logo-box">R</span>
        <span class="brand-name">ReScheduled</span>
      </a>
      <div class="nav-links">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/timetable.html">Timetable</a>
        <a href="/notices.html" class="active">Notices</a>
        <a href="/notifications.html">Alerts</a>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="page-wrap">
    <div class="card-wrap">

      <!-- Top Header -->
      <div class="top-bar">
        <div class="title-group">
          <h1>📢 Campus Notices</h1>
          <p>Official announcements, schedule changes, and departmental memos</p>
        </div>
        <div>
          <a href="/timetable.html" class="btn-pill">&larr; Back to Timetable</a>
        </div>
      </div>

      <!-- 4.1 Filter Tabs & 4.2 Instant Search -->
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter notices by category">
          <button class="filter-btn active" onclick="setCategory('all', this)">All</button>
          <button class="filter-btn" onclick="setCategory('urgent', this)">Urgent</button>
          <button class="filter-btn" onclick="setCategory('shift', this)">Schedule Shift</button>
          <button class="filter-btn" onclick="setCategory('general', this)">General</button>
        </div>

        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="🔍 Search notices, room, faculty..."
          oninput="handleSearch(this.value)"
          aria-label="Search campus notices"
        />
      </div>

      <!-- 4.3 Notice Cards Feed -->
      <div class="notice-list" id="noticeContainer">
        <p style="text-align: center; color: var(--text-muted); padding: 30px;">Loading notices...</p>
      </div>

    </div>
  </main>

  <!-- 4.4 Pop-up Modal Dialog for Full Memo Review -->
  <div class="modal-backdrop" id="noticeModal" role="dialog" aria-modal="true" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()" aria-label="Close modal">&times;</button>
      <div id="modalCategory" style="margin-bottom: 8px;"></div>
      <h2 id="modalTitle" style="font-size: 18px; font-weight: 700; color: var(--text-main); margin: 0 0 8px 0;"></h2>
      <p id="modalDate" style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;"></p>
      <hr style="border: none; border-top: 1px solid var(--border); margin-bottom: 14px;" />
      <p id="modalContent" style="font-size: 14px; color: var(--text-main); line-height: 1.6;"></p>
    </div>
  </div>

  <!-- Client-Side Logic (Simple, Clean, Easy to Explain in Viva) -->
  <script>
    let allNotices = [];
    let activeCategory = 'all';
    let searchQuery = '';

    // 1. Fetch notices from server
    async function fetchNotices() {
      try {
        const res = await fetch('/api/notices');
        const data = await res.json();
        allNotices = data.notices || (Array.isArray(data) ? data : []);
        renderNotices();
      } catch (err) {
        document.getElementById('noticeContainer').innerHTML = 
          '<p style="text-align: center; color: #dc2626; padding: 20px;">Unable to load notices from server.</p>';
      }
    }

    // 2. Render notice cards based on category and search query
    function renderNotices() {
      const container = document.getElementById('noticeContainer');
      const q = searchQuery.toLowerCase();

      const filtered = allNotices.filter(item => {
        const p = (item.priority || item.category || 'general').toLowerCase();
        
        let matchesCategory = (activeCategory === 'all');
        if (activeCategory === 'urgent') matchesCategory = (p === 'urgent' || p === 'high');
        else if (activeCategory === 'shift') matchesCategory = (p.includes('shift'));
        else if (activeCategory === 'general') matchesCategory = (p === 'general');

        const titleMatch = (item.title || '').toLowerCase().includes(q);
        const textMatch = (item.content || item.description || '').toLowerCase().includes(q);
        return matchesCategory && (titleMatch || textMatch);
      });

      if (!filtered.length) {
        container.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px; border: 1px dashed var(--border); border-radius: 8px;">No matching notices found.</p>';
        return;
      }

      container.innerHTML = filtered.map(item => {
        const p = (item.priority || item.category || 'general').toLowerCase();
        let badgeClass = 'badge-general';
        let badgeLabel = 'General';

        if (p === 'urgent' || p === 'high') {
          badgeClass = 'badge-urgent';
          badgeLabel = 'Urgent';
        } else if (p.includes('shift')) {
          badgeClass = 'badge-shift';
          badgeLabel = 'Schedule Shift';
        }

        const dateStr = item.date || (item.createdAt ? new Date(item.createdAt).toLocaleDateString([], { day: '2-digit', month: 'short', year: 'numeric' }) : 'Recent');

        return `
          <div class="notice-card" onclick="openModal('${item._id}')">
            <div class="notice-header">
              <span class="badge ${badgeClass}">${badgeLabel}</span>
              <span class="notice-date">📅 ${dateStr}</span>
            </div>
            <div class="notice-title">${item.title || 'Untitled Notice'}</div>
            <p class="notice-snippet">${(item.content || item.description || '').slice(0, 140)}...</p>
          </div>
        `;
      }).join('');
    }

    // 3. Category Filter Handler
    function setCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderNotices();
    }

    // 4. Instant Search Handler
    function handleSearch(val) {
      searchQuery = val.trim();
      renderNotices();
    }

    // 5. Modal Dialog Handlers
    function openModal(id) {
      const item = allNotices.find(n => n._id === id);
      if (!item) return;

      const p = (item.priority || item.category || 'general').toLowerCase();
      let badgeClass = 'badge-general';
      let badgeLabel = 'General';
      if (p === 'urgent' || p === 'high') { badgeClass = 'badge-urgent'; badgeLabel = 'Urgent'; }
      else if (p.includes('shift')) { badgeClass = 'badge-shift'; badgeLabel = 'Schedule Shift'; }

      document.getElementById('modalCategory').innerHTML = `<span class="badge ${badgeClass}">${badgeLabel}</span>`;
      document.getElementById('modalTitle').textContent = item.title || 'Announcement';
      document.getElementById('modalDate').textContent = 'Posted: ' + (item.date || (item.createdAt ? new Date(item.createdAt).toLocaleString() : 'Recent'));
      document.getElementById('modalContent').textContent = item.content || item.description || '';
      document.getElementById('noticeModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('noticeModal').classList.remove('show');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    fetchNotices();
  </script>
</body>
</html>
