<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Override Timetable</title>
    <link rel="stylesheet" href="./css/admin-override-timetable.css">
</head>

<body>

<div class="page">

    <header>
        <div class="brand">
            <div class="logo">R</div>
            <b>ReScheduled</b>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="timetable.html">Timetable</a>
            <a href="tasks.html">Tasks</a>
        </nav>
    </header>


    <main>

        <section class="intro">
            <h1>Override Timetable</h1>
            <p>Make temporary changes without modifying the master timetable.</p>
        </section>


        <section class="card filters">

            <select id="semester">
                <option value="">Semester</option>
            </select>

            <input type="date" id="date">

            <button onclick="loadTimetable()">LOAD</button>

        </section>


        <section class="card">

            <h2 id="heading">Select a semester and date</h2>

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>Slot</th>
                            <th>Time</th>
                            <th>Subject</th>
                            <th>Faculty</th>
                            <th>Room</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="tableBody">
                        <tr>
                            <td colspan="6" class="empty">
                                No timetable loaded.
                            </td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<!-- Override Modal -->

<div class="modal" id="modal">

    <form class="modal-box" onsubmit="saveOverride(event)">

        <h2>Override Slot</h2>

        <p id="slotInfo"></p>


        <label>Status</label>

        <select id="status"
                onchange="toggleFields()"
                required>

            <option value="">Select status</option>
            <option value="CANCELLED">Cancelled</option>
            <option value="RESCHEDULED">Rescheduled</option>
            <option value="SUBSTITUTE">Substitute</option>
            <option value="SWAPPED">Swap</option>

        </select>


        <div id="slotField">

            <label id="slotLabel">New Slot</label>

            <select id="newSlot">
                <option value="">Select slot</option>
            </select>

        </div>


        <div id="roomField">

            <label>New Room</label>

            <input
                id="newRoom"
                placeholder="Room">

        </div>


        <div id="facultyField">

            <label>Substitute Faculty</label>

            <select id="faculty">
                <option value="">Select faculty</option>
            </select>

        </div>


        <label>Reason *</label>

        <input
            id="reason"
            placeholder="Reason for override"
            required>


        <div class="actions">

            <button
                type="button"
                class="cancel"
                onclick="closeModal()">
                Cancel
            </button>

            <button type="submit">
                SAVE CHANGE
            </button>

        </div>

    </form>

</div>


<script>

let masterSlots = [];
let daySlots = [];
let selectedSlot = null;
let overrides = [];

const semesterEl = document.getElementById("semester");
const dateEl = document.getElementById("date");
const tableBody = document.getElementById("tableBody");

const modal = document.getElementById("modal");
const statusEl = document.getElementById("status");
const newSlotEl = document.getElementById("newSlot");
const newRoomEl = document.getElementById("newRoom");
const facultyEl = document.getElementById("faculty");
const reasonEl = document.getElementById("reason");

const slotField = document.getElementById("slotField");
const roomField = document.getElementById("roomField");
const facultyField = document.getElementById("facultyField");


// Load master timetable
async function loadMasterSlots() {

    try {

        const res = await fetch("/api/master-slots");
        const data = await res.json();

        if (!data.success)
            throw new Error(data.message);

        masterSlots = data.slots || [];

        const semesters = [
            ...new Set(
                masterSlots.map(x => x.semester)
            )
        ];

        semesterEl.innerHTML =
            `<option value="">Semester</option>` +
            semesters.map(x =>
                `<option value="${x}">${x}</option>`
            ).join("");

    } catch (err) {

        console.error(err);
        alert("Failed to load master timetable.");
    }
}


// Load selected date
async function loadTimetable() {

    const semester = semesterEl.value;
    const date = dateEl.value;

    if (!semester || !date) {
        alert("Select semester and date.");
        return;
    }

    const day = new Date(date + "T00:00:00")
        .toLocaleDateString(
            "en-US",
            { weekday: "long" }
        );


    daySlots = masterSlots.filter(slot =>
        slot.semester === semester &&
        slot.day === day
    );


    try {

        const res = await fetch(
            `/api/overrides/date/${date}`
        );

        const data = await res.json();

        overrides = (data.overrides || [])
            .filter(x => x.semester === semester);

    } catch (err) {

        console.error(err);
        overrides = [];
    }


    document.getElementById("heading").textContent =
        `${day} — ${date}`;

    display();
}


// Display timetable
function display() {

    if (!daySlots.length) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="6" class="empty">
                    No timetable available.
                </td>
            </tr>
        `;

        return;
    }


    tableBody.innerHTML = daySlots.map(slot => {

        const override =
            overrides.find(x =>
                x.slot === slot.slot
            );


        let action = "Override";

        if (override) {
            action = override.status;
        }


        return `
            <tr>
                <td>${slot.slot}</td>
                <td>${slot.time}</td>
                <td>${slot.subject}</td>
                <td>${slot.faculty}</td>
                <td>${slot.room}</td>

                <td>
                    ${
                        override
                        ? `<span class="status">${action}</span>`
                        : `<button onclick="openModal('${slot.slot}')">
                            Override
                           </button>`
                    }
                </td>
            </tr>
        `;

    }).join("");
}


// Open modal
function openModal(slotNumber) {

    selectedSlot =
        daySlots.find(x =>
            x.slot === slotNumber
        );

    if (!selectedSlot) return;


    document.getElementById("slotInfo").textContent =
        `${selectedSlot.subject} • Slot ${selectedSlot.slot} • ${selectedSlot.time}`;


    statusEl.value = "";
    reasonEl.value = "";
    newRoomEl.value = "";
    facultyEl.value = "";


    populateSlots();
    populateFaculty();

    toggleFields();

    modal.classList.add("show");
}


// Populate available slots
function populateSlots() {

    newSlotEl.innerHTML =
        `<option value="">Select slot</option>` +

        daySlots
            .filter(x =>
                x.slot !== selectedSlot.slot
            )
            .map(x =>
                `<option value="${x.slot}">
                    Slot ${x.slot} — ${x.time} — ${x.subject}
                </option>`
            )
            .join("");
}


// Populate faculty from timetable
function populateFaculty() {

    const faculty = [
        ...new Set(
            masterSlots
                .filter(x =>
                    x.semester === semesterEl.value
                )
                .map(x => x.faculty)
                .filter(Boolean)
        )
    ];

    facultyEl.innerHTML =
        `<option value="">Select faculty</option>` +

        faculty.map(x =>
            `<option value="${x}">${x}</option>`
        ).join("");
}


// Show relevant fields
function toggleFields() {

    const type = statusEl.value;

    slotField.style.display =
        type === "RESCHEDULED" ||
        type === "SWAPPED"
            ? "block"
            : "none";


    roomField.style.display =
        type === "RESCHEDULED"
            ? "block"
            : "none";


    facultyField.style.display =
        type === "SUBSTITUTE"
            ? "block"
            : "none";


    document.getElementById("slotLabel").textContent =
        type === "SWAPPED"
            ? "Swap With"
            : "New Slot";
}


// Close modal
function closeModal() {

    modal.classList.remove("show");
}


// Save override
async function saveOverride(event) {

    event.preventDefault();

    const type = statusEl.value;

    if (!type) {
        alert("Select a status.");
        return;
    }


    if (
        (type === "RESCHEDULED" ||
         type === "SWAPPED") &&
        !newSlotEl.value
    ) {
        alert("Select a slot.");
        return;
    }


    if (
        type === "RESCHEDULED" &&
        !newRoomEl.value
    ) {
        alert("Enter the new room.");
        return;
    }


    if (
        type === "SUBSTITUTE" &&
        !facultyEl.value
    ) {
        alert("Select substitute faculty.");
        return;
    }


    if (!reasonEl.value.trim()) {
        alert("Reason is required.");
        return;
    }


    const targetSlot =
        daySlots.find(x =>
            x.slot === newSlotEl.value
        );


    const data = {

        overrideId:
            `${dateEl.value}-${selectedSlot.slot}-${Date.now()}`,

        semester:
            semesterEl.value,

        date:
            dateEl.value,

        slot:
            selectedSlot.slot,

        status:
            type,

        newSlot:
            type === "RESCHEDULED" ||
            type === "SWAPPED"
                ? newSlotEl.value
                : null,

        newRoom:
            type === "RESCHEDULED"
                ? newRoomEl.value
                : type === "SWAPPED"
                    ? targetSlot.room
                    : null,

        substituteFaculty:
            type === "SUBSTITUTE"
                ? facultyEl.value
                : null,

        reason:
            reasonEl.value.trim()
    };


    try {

        const res = await fetch(
            "/api/overrides",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(data)
            }
        );


        const result = await res.json();


        if (!res.ok) {
            throw new Error(
                result.message ||
                "Override creation failed."
            );
        }


        alert(
            result.message ||
            "Override saved successfully."
        );


        closeModal();

        loadTimetable();


    } catch (err) {

        console.error(err);

        alert(
            err.message ||
            "Override creation failed."
        );
    }
}


document.addEventListener(
    "DOMContentLoaded",
    loadMasterSlots
);

</script>

</body>
</html>
