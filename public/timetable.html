<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Timetable Matrix - Reschedule</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f1f5f9;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 24px 16px;
    }

    .card-wrap {
      max-width: 620px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    /* Top Title Row */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title-group h1 {
      font-size: 19px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-group p {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .btn-outline {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: #1e40af;
      border: 1px solid #1e40af;
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Filter inputs */
    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .filter-item label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .filter-item select, .filter-item input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 12px;
      background: #ffffff;
      color: #0f172a;
    }

    /* Day Switcher */
    .day-row {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .day-btn {
      flex: 1;
      min-width: 65px;
      padding: 8px 4px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 12px;
      color: #475569;
      cursor: pointer;
      text-align: center;
      font-weight: 500;
    }

    .day-btn.active {
      background: #1e40af;
      border-color: #1e40af;
      color: #ffffff;
      font-weight: 600;
    }

    /* Legend Row */
    .legend-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #64748b;
      padding-bottom: 12px;
      border-bottom: 1px solid #f1f5f9;
      margin-bottom: 16px;
    }

    .legend-dots {
      display: flex;
      gap: 10px;
    }

    .legend-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 4px;
    }

    /* Slot Card (The Matrix Item) */
    .slot-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slot-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      gap: 14px;
      position: relative;
    }

    .slot-card.rescheduled {
      background: #fffdf5;
      border-color: #fde68a;
    }

    .slot-time-box {
      min-width: 68px;
      text-align: center;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .slot-card.rescheduled .slot-time-box {
      background: #fefce8;
      border-color: #fef08a;
    }

    .slot-label {
      font-size: 10px;
      color: #64748b;
      font-weight: 600;
    }

    .slot-time {
      font-size: 12px;
      font-weight: 700;
      color: #1e40af;
      margin: 2px 0;
    }

    .slot-end {
      font-size: 10px;
      color: #94a3b8;
    }

    .slot-body {
      flex: 1;
    }

    .slot-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .code-tag {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
    }

    .subject-name {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
    }

    .slot-details {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: #475569;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .venue-pill {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .shift-alert {
      background: #fef3c7;
      border: 1px solid #fde68a;
      color: #92400e;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 6px;
    }

    .status-pill {
      margin-left: auto;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      align-self: flex-start;
    }

    .status-confirmed {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .status-rescheduled {
      background: #fffbeb;
      color: #b45309;
      border: 1px solid #fde68a;
    }

    /* Break Banner */
    .break-row {
      background: #fafaf9;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
    }

    /* Bottom Status */
    .card-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px solid #f1f5f9;
      font-size: 10px;
      color: #94a3b8;
    }

    @media (max-width: 500px) {
      .filter-grid {
        grid-template-columns: 1fr;
      }
      .slot-card {
        flex-direction: column;
      }
      .slot-time-box {
        flex-direction: row;
        justify-content: space-around;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="card-wrap">
    
    <!-- Top Header -->
    <div class="top-bar">
      <div class="title-group">
        <h1>📅 Weekly Timetable Matrix</h1>
        <p>Real-time synchronized student timetable with CR adjustments</p>
      </div>
      <div class="top-actions">
        <a href="/notices.html" class="btn-outline" style="text-decoration: none;">Notices &rarr;</a>
        <button class="btn-primary" onclick="setToday()">Jump to Today</button>
      </div>
    </div>

    <!-- Dropdowns & Search -->
    <div class="filter-grid">
      <div class="filter-item">
        <label>Academic Term</label>
        <select id="semSelect" onchange="loadSchedule(currentDay)">
          <option value="5">5th Sem — CSE (Sect A)</option>
          <option value="1">1st Sem — CSE (Sect A)</option>
          <option value="3">3rd Sem — CSE (Sect A)</option>
        </select>
      </div>
      <div class="filter-item">
        <label>Filter by Subject or Room</label>
        <input type="search" id="subjectFilter" placeholder="🔍 e.g. CS501, LH-204, Dr. Anand" oninput="filterSlots(this.value)">
      </div>
    </div>

    <!-- Monday to Friday Day Buttons -->
    <div class="day-row">
      <button class="day-btn" onclick="changeDay(this, 'Monday')">Mon (4)</button>
      <button class="day-btn" onclick="changeDay(this, 'Tuesday')">Tue (5)</button>
      <button class="day-btn active" onclick="changeDay(this, 'Wednesday')">Wed • Today</button>
      <button class="day-btn" onclick="changeDay(this, 'Thursday')">Thu (4)</button>
      <button class="day-btn" onclick="changeDay(this, 'Friday')">Fri (5)</button>
    </div>

    <!-- Legend -->
    <div class="legend-row">
      <div id="slotsSummary">Wednesday Slots (09:00 — 16:30)</div>
      <div class="legend-dots">
        <span><span class="legend-dot" style="background:#10b981;"></span>Confirmed</span>
        <span><span class="legend-dot" style="background:#f59e0b;"></span>Rescheduled</span>
        <span><span class="legend-dot" style="background:#2563eb;"></span>Lab</span>
      </div>
    </div>

    <!-- Slots Feed List -->
    <div class="slot-list" id="slotContainer">
      <p style="text-align: center; color: #64748b; padding: 20px;">Loading schedule matrix...</p>
    </div>

    <!-- Footer Sync -->
    <div class="card-footer">
      <span>● Live sync active with Department Master (Auto-updates every 60s)</span>
      <span>Sync ID: #CSE-5A</span>
    </div>

  </div>

  <script>
    let currentDay = 'Wednesday';
    let rawSlots = [];

    async function loadSchedule(day) {
      currentDay = day;
      const sem = document.getElementById('semSelect').value;
      const container = document.getElementById('slotContainer');
      document.getElementById('slotsSummary').textContent = `${day} Slots (09:00 — 16:30)`;

      container.innerHTML = '<p style="text-align: center; color: #64748b; padding: 24px;">Loading timetable...</p>';

      try {
        const res = await fetch(`/api/timetable?day=${day}&semester=${sem}`);
        rawSlots = await res.json();
        renderSlots(rawSlots);
      } catch (err) {
        container.innerHTML = '<p style="text-align: center; color: #dc2626; padding: 20px;">Unable to connect to database.</p>';
      }
    }

    function renderSlots(slots) {
      const container = document.getElementById('slotContainer');

      if (!slots || slots.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 30px; color: #64748b; border: 1px dashed #cbd5e1; border-radius: 10px;">
            No classes scheduled for ${currentDay}.
          </div>`;
        return;
      }

      let html = '';
      slots.forEach((s, idx) => {
        // Break insertion after 2nd class
        if (idx === 2) {
          html += `
            <div class="break-row">
              🍴 11:45 AM — 12:45 PM • Midday Academic Break & Common Hour
            </div>
          `;
        }

        const isRescheduled = s.status === 'rescheduled' || s.room === 'Seminar Hall B';
        const cardClass = isRescheduled ? 'slot-card rescheduled' : 'slot-card';
        const statusBadge = isRescheduled 
          ? '<span class="status-pill status-rescheduled">⚠️ Rescheduled</span>'
          : '<span class="status-pill status-confirmed">● Confirmed</span>';

        html += `
          <div class="${cardClass}">
            <div class="slot-time-box">
              <span class="slot-label">Slot ${s.slot || idx + 1}</span>
              <span class="slot-time">${(s.time || '09:00').split('-')[0].trim()}</span>
              <span class="slot-end">${(s.time || '').split('-')[1] || ''}</span>
            </div>
            <div class="slot-body">
              <div class="slot-top">
                <span class="code-tag">${s.code || 'CS50' + (idx+1)}</span>
                <span class="subject-name">${s.subject || 'Class'}</span>
                ${statusBadge}
              </div>
              <div class="slot-details">
                <span>👤 ${s.faculty || 'Faculty'}</span>
                <span class="venue-pill">🏛️ ${s.room || 'Room'}</span>
              </div>
              ${isRescheduled ? `
                <div class="shift-alert">
                  <strong>↔ LH-104 &rarr; ${s.room || 'Seminar Hall B'}</strong><br>
                  ⚠️ Relocated by CR due to projector maintenance.
                </div>` : ''}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function filterSlots(val) {
      const q = val.toLowerCase();
      const filtered = rawSlots.filter(s => 
        (s.subject || '').toLowerCase().includes(q) ||
        (s.code || '').toLowerCase().includes(q) ||
        (s.room || '').toLowerCase().includes(q) ||
        (s.faculty || '').toLowerCase().includes(q)
      );
      renderSlots(filtered);
    }

    function changeDay(btn, day) {
      document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadSchedule(day);
    }

    function setToday() {
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const today = days[new Date().getDay()];
      const target = (today === 'Sunday' || today === 'Saturday') ? 'Monday' : today;

      const buttons = document.querySelectorAll('.day-btn');
      buttons.forEach(b => {
        if (b.textContent.includes(target.slice(0, 3))) {
          changeDay(b, target);
        }
      });
    }

    loadSchedule('Wednesday');
  </script>
</body>
</html>
