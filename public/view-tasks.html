<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks — ReScheduled</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/notices.css?v=2">
  <script>
    if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    const savedFontSize = localStorage.getItem('fontSize');
    if (savedFontSize) document.documentElement.setAttribute('data-size', savedFontSize);
  </script>
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="navbar" role="banner">
    <div class="nav-container">
      <a href="/" class="logo">
        <span class="brand-name">ReScheduled</span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="/dashboard.html">Dashboard</a>
        <a href="/timetable.html">Timetable</a>
        <a href="/notices.html">Notices</a>
        <a href="/view-tasks.html" class="active" aria-current="page">Tasks</a>
      </nav>
      <div class="header-controls">
        <div class="size-controls" role="group" aria-label="Text size adjustment">
          <button type="button" data-size="-1" aria-label="Decrease text size" title="Decrease text size">A−</button>
          <button type="button" data-size="0" aria-label="Reset text size" aria-pressed="true" title="Reset text size">A</button>
          <button type="button" data-size="1" aria-label="Increase text size" title="Increase text size">A+</button>
        </div>
        <button type="button" id="themeToggle" class="theme-toggle-btn" aria-label="Toggle dark theme" title="Toggle theme">☾</button>
      </div>
    </div>
  </header>

  <main class="page" id="main-content">
    <header class="top">
      <div>
        <h1 class="title">Class Tasks</h1>
        <p class="subtitle">Assignments, quizzes, lab submissions and projects from your Class Representative.</p>
      </div>
    </header>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks by status">
        <button class="filter-btn active" data-filter="all" aria-pressed="true">All <span class="filter-count" id="count-all">0</span></button>
        <button class="filter-btn" data-filter="pending" aria-pressed="false">Pending <span class="filter-count" id="count-pending">0</span></button>
        <button class="filter-btn" data-filter="completed" aria-pressed="false">Completed <span class="filter-count" id="count-completed">0</span></button>
      </div>
      <input type="search" id="searchInput" class="search-input" placeholder="Search tasks..." aria-label="Search tasks">
    </div>

    <section class="feed" id="taskContainer" role="feed" aria-label="Class task feed" aria-live="polite">
      <div class="empty">Loading tasks...</div>
    </section>
  </main>

  <footer role="contentinfo">
    <hr>
    <div class="footer-container">
      <div class="footer-content">
        <div class="footer-logo">
          <span class="brand-name">ReScheduled</span>
        </div>
        <nav class="footer-links" aria-label="Footer quick links">
          <a href="/notices.html">View Notices</a>
          <a href="/timetable.html">View Timetable</a>
          <a href="/admin-dashboard.html">CR Dashboard</a>
        </nav>
      </div>
      <p>&copy; Copyrights reserved 2026 | ReScheduled</p>
    </div>
  </footer>

  <script src="./scripts/a11y.js"></script>
  <script>
    let allTasks = [];
    let activeFilter = 'all';
    let searchQuery = '';

    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[char]));

    function formatDate(value) {
      if (!value) return 'Due date not set';
      const date = new Date(`${value}T00:00:00`);
      return Number.isNaN(date.getTime())
        ? escapeHtml(value)
        : date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function updateCounts() {
      document.getElementById('count-all').textContent = allTasks.length;
      document.getElementById('count-pending').textContent = allTasks.filter(task => !task.isCompleted).length;
      document.getElementById('count-completed').textContent = allTasks.filter(task => task.isCompleted).length;
    }

    function renderTasks() {
      const query = searchQuery.toLowerCase();
      const filtered = allTasks.filter(task => {
        const matchesFilter = activeFilter === 'all' ||
          (activeFilter === 'completed' ? task.isCompleted : !task.isCompleted);
        const text = `${task.name} ${task.type} ${task.description || ''}`.toLowerCase();
        return matchesFilter && text.includes(query);
      });
      const container = document.getElementById('taskContainer');

      if (!filtered.length) {
        container.innerHTML = '<div class="empty">No matching tasks found.</div>';
        return;
      }

      container.innerHTML = filtered.map(task => `
        <article class="notification" role="article" aria-label="${escapeHtml(task.name)}">
          <div class="dot ${task.isCompleted ? 'general' : 'shift'}" aria-hidden="true"></div>
          <div class="notification-content">
            <div class="notification-top">
              <span class="badge ${task.isCompleted ? 'general' : 'shift'}">${task.isCompleted ? 'Completed' : 'Pending'}</span>
              <span class="time">${escapeHtml(formatDate(task.date))}</span>
            </div>
            <h2 class="notification-title">${escapeHtml(task.name)}</h2>
            <p class="notification-text">${escapeHtml(task.description || 'No additional details provided.')}</p>
            <p class="notification-text"><strong>Type:</strong> ${escapeHtml(task.type)}${task.room ? ` &nbsp; <strong>Room:</strong> ${escapeHtml(task.room)}` : ''}</p>
          </div>
        </article>
      `).join('');
    }

    async function loadTasks() {
      try {
        const response = await fetch('/api/tasks');
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || 'Unable to load tasks');
        allTasks = data.tasks || [];
        updateCounts();
        renderTasks();
      } catch (error) {
        document.getElementById('taskContainer').innerHTML =
          '<div class="empty" style="color: #be123c;">Unable to load tasks from server.</div>';
      }
    }

    document.querySelectorAll('[data-filter]').forEach(button => {
      button.addEventListener('click', () => {
        activeFilter = button.dataset.filter;
        document.querySelectorAll('[data-filter]').forEach(item => {
          const active = item === button;
          item.classList.toggle('active', active);
          item.setAttribute('aria-pressed', String(active));
        });
        renderTasks();
      });
    });

    document.getElementById('searchInput').addEventListener('input', event => {
      searchQuery = event.target.value.trim();
      renderTasks();
    });

    loadTasks();
  </script>
</body>

</html>
